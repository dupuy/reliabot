name: Cancel jobs pending approval on a PR close
# This is intended to prevent GHA jobs from sitting around for 30 days waiting
# for an approval that would only come too late. It does create problems it you
# close a PR and then later re-open it, but it is possible to manually re-run
# any jobs that were never approved. Use scripts/stalled-actions.sh to see if
# this is working as intended.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel-pending-approval:
    runs-on: ubuntu-26.04
    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: 'Cancel jobs pending approval'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const head_sha = context.payload.pull_request.head.sha;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'action_required',   // the "pending approval" state
              head_sha,
              per_page: 100,
            });
            for (const run of data.workflow_runs) {
              console.log(`Cancelling run ${run.id} (${run.name})`);
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }
