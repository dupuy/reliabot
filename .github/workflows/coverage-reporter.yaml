# Adapted from https://github.com/codacy/codacy-coverage-reporter-action and
# extended to upload to GitHub as well.

name: 'Coverage Reporter'

on: # zizmor: ignore[dangerous-triggers] no checkout, no direct context use
  workflow_run:
    workflows: ['Run tests with coverage']
    types:
      - completed

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  coverage-reporter:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read # Needed to download artifacts
      code-quality: write
    # Only run on primary fork, since this requires a Codacy project token
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.repository == 'dupuy/reliabot'
    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.codacy.com:443
            api.github.com:443
            artifacts.codacy.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: 'Download coverage report'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$GH_RUN_ID" --name coverage-report

      - name: 'Upload coverage to Codacy'
        uses: step-security/codacy-coverage-reporter-action@44e97cd9a5e5328b79a4fd414746d6b074da1411 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          continue-on-error: true # Codacy failure must not block GitHub upload
          coverage-reports: 'cobertura.xml'
          language: Python

      - name: 'Upload coverage to GitHub Code Quality'
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: cobertura.xml
          label: 'code-coverage/tox'
          language: Python
