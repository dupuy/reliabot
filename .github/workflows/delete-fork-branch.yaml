name: Delete branch on PR close

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    # Ensures this only triggers for PR branch heads from this forked repository
    # (and not at all for non-forked PRs that are deleted automatically).
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: >
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF"
