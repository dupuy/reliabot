name: Handle upstream PR closed notification

on:
  repository_dispatch:
    types: [closed_upstream_pr]

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  handler:
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    env:
      BASE: ${{ github.event.client_payload.base }}
      HEAD: ${{ github.event.client_payload.head }}
      MERGED: ${{ github.event.client_payload.merged }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      REPO: ${{ github.repository }}
      UPSTREAM: ${{ github.event.client_payload.upstream }}
      # Fine-grained PAT for upstream repo with Pull requests: Read and write
      UPSTREAM_PR_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }} # For update comments

    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: 'Show payload'
        run: |
          if $MERGED; then OUTCOME=merged; else OUTCOME=closed; fi
          echo "Upstream $UPSTREAM PR #$PR_NUMBER from $HEAD to $BASE $OUTCOME"

      - name: 'Sync'
        if: >
          github.event.client_payload.head_repo == github.repository &&
          github.event.client_payload.merged
        continue-on-error: true
        env:
          # Fine-grained PAT with Contents & Workflows: Read and write
          GH_TOKEN: secrets.SYNC_TOKEN
        run: |
          ERR=0
          STATUS=Synced
          MSG="$UPSTREAM \`$BASE\` to $REPO after merging PR"
          if ! OUT=$(gh repo sync "$REPO" -b "$BASE" 2>&1); then
            ERR=1
            STATUS="Failed to sync"
            MSG="$MSG:$(echo)$OUT"
          fi
          BODY="$STATUS $MSG"
          GH_TOKEN="$UPSTREAM_PR_TOKEN" \
            gh pr comment "$PR_NUMBER" --repo "$UPSTREAM" --body "$BODY" ||
          exit "$ERR"

      - name: 'Delete PR head branch'
        if: github.event.client_payload.head_repo == github.repository
        continue-on-error: true
        env:
          BRANCH: 'repos/${{ env.REPO }}/git/refs/heads/${{ env.HEAD }}'
        run: |
          ERR=0
          if ! OUT=$(gh api --method DELETE "$BRANCH" 2>&1); then
            ERR=1
            MSG="Failed to delete branch \`$HEAD\` from $REPO after closing PR"
            BODY="$MSG$(echo)$OUT"
            GH_TOKEN="$UPSTREAM_PR_TOKEN" \
              gh pr comment "$PR_NUMBER" --repo "$UPSTREAM" --body "$BODY"
          fi
          exit "$ERR"
