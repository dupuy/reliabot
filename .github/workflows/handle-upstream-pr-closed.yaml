name: Handle upstream PR closed notification

on:
  repository_dispatch:
    types: [closed_upstream_pr]

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  handler:
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    env:
      BASE: ${{ github.event.client_payload.base }}
      HEAD: ${{ github.event.client_payload.head }}
      MERGED: ${{ github.event.client_payload.merged }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      REPO: ${{ github.repository }}
      UPSTREAM: ${{ github.event.client_payload.upstream }}

      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # fork-scoped for Sync / Delete
      UPSTREAM_PR_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
      # Fine-grained PAT for upstream repo with Pull requests: Read and write

    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443

      - name: Show payload
        run: |
          if $MERGED; then OUTCOME=merged; else OUTCOME=closed; fi
          echo "Upstream $UPSTREAM PR #$PR_NUMBER from $HEAD to $BASE $OUTCOME"

      - name: 'Sync'
        if: ${{ github.event.client_payload.merged }}
        continue-on-error: true
        run: |
          SYNC_MSG="Sync of $UPSTREAM \`$BASE\` to $REPO after this PR merged."
          OUT=$(gh repo sync "$REPO" -b "$BASE" 2>&1)
          if test $? = 0; then
            GH_TOKEN="$UPSTREAM_PR_TOKEN" \
              gh pr comment "$PR_NUMBER" --repo "$UPSTREAM" --body "$SYNC_MSG"
          else
            echo Failed "$SYNC_MSG"; echo "$OUT"
            exit 1
          fi

      - name: 'Delete PR head branch'
        if: ${{ github.event.client_payload.head_repo == github.repository }}
        continue-on-error: true
        run: |
          DELETE_MSG="Deleted PR branch $HEAD from $REPO after closing this PR."
          OUT=$(gh api --method DELETE "repos/$REPO/git/refs/heads/$HEAD" 2>&1)
          if test $? = 0; then
            GH_TOKEN="$UPSTREAM_PR_TOKEN" \
              gh pr comment "$PR_NUMBER" --repo "$UPSTREAM" --body "$DELETE_MSG"
          else
            echo Failed "$DELETE_MSG"; echo "$OUT"
            exit 1
          fi
