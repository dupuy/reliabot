name: 'Publish release'

# This workflow handles tasks that require write permissions or OIDC tokens.
# It is triggered after the completion of the main CI workflow.
# Since it runs in the context of the main branch, it has access to secrets
# and OIDC tokens even for pull requests from forks.

on:
  workflow_run:
    branches: [main]
    workflows: ['Test, build, release, and upload Python Poetry app']
    types:
      - completed

# Declare default permissions as read only.
permissions:
  contents: read

# Only run this publish workflow for one commit at a time, don't cancel any
# pending jobs.
# Grouped by commit: o global group could cancel a pending publish job for a
# burst of no-release pushes, since GitHub keeps only one pending run per group.
concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  ARTIFACTS_DIR: artifacts
  RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Needed to download artifacts
    # Security: only run if the triggering workflow succeeds, and it's a push.
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.repository == 'dupuy/reliabot'
    timeout-minutes: 5
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      skip: ${{ steps.metadata.outputs.skip }}
      DIST: ${{ steps.metadata.outputs.DIST }}
      pr_release: ${{ steps.metadata.outputs.pr_release }}
      pr_tag: ${{ steps.metadata.outputs.pr_tag }}
      RELEASE_NAME: ${{ steps.metadata.outputs.RELEASE_NAME }}
      VERSION_TAG: ${{ steps.metadata.outputs.VERSION_TAG }}

    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: 'Download artifacts (if any)'
        # If there are no artifacts, this was not a release merge/push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARTIFACTS: ${{ env.GH_REPO }}/actions/runs/${{ env.RUN_ID }}/artifacts
        run: |
          if COUNT=$(gh api "repos/$ARTIFACTS" --jq '.total_count') &&
              [ "$COUNT" -gt 0 ]; then
            gh run download "$RUN_ID" --dir "$ARTIFACTS_DIR"
          else
            echo "No artifacts from run $RUN_ID — nothing to publish."
            mkdir -p "$ARTIFACTS_DIR"
          fi

      - name: 'Load metadata'
        id: metadata
        run: |
          # Use grep to protect against metachars in folder name
          METADATA_FILE=$(find "$ARTIFACTS_DIR" -name metadata.json |
                          grep -E '^[0-9A-Za-z/._-]+$' | head -n 1)
          {
            if [ -z "$METADATA_FILE" ]; then
              echo "skip=true"
              exit 0
            fi

            # Extract values using jq and set as outputs
            echo "skip=false"
            echo "DIST=$(dirname "$METADATA_FILE")"
            for K in ARTIFACT_NAME pr_release pr_tag RELEASE_NAME VERSION_TAG
            do
              echo "$K=$(jq -r '.["'"$K"'"]' "$METADATA_FILE")"
            done
          } | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT" # and also stdout

      - name: 'Generate hashes'
        id: hash
        run: |
          {
            cd "$ARTIFACTS_DIR" &&
              echo "hashes=$(sha256sum "$ARTIFACT_NAME"/* | base64 -w0)"
          } >> "$GITHUB_OUTPUT"

  test-release:
    runs-on: ubuntu-24.04
    needs: prepare
    # Only run if prepare succeeds, and it's a pre-release (pr_release is false)
    if: >
      needs.prepare.outputs.skip == 'false' &&
      needs.prepare.outputs.pr_tag == 'true' &&
      needs.prepare.outputs.pr_release == 'false'
    timeout-minutes: 15
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/reliabot

    env:
      DIST: ${{ needs.prepare.outputs.DIST }}
      RELEASE_NAME: ${{ needs.prepare.outputs.RELEASE_NAME }}
      VERSION_TAG: ${{ needs.prepare.outputs.VERSION_TAG }}

    permissions:
      id-token: write # Trusted publishing requires this permission
      attestations: write
      contents: write # Needed for draft release creation
      actions: read # Needed to download artifacts

    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            rekor.sigstore.dev:443
            releases.astral.sh:443
            test.pypi.org:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: 'Download artifacts'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$RUN_ID" --dir "$ARTIFACTS_DIR"

      - name: 'Sign built artifacts'
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >
            ${{ env.DIST }}/*.tar.gz
            ${{ env.DIST }}/*.whl
            ${{ env.DIST }}/reliabot.spdx.json

      - name: 'Attest SBOM'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: '${{ env.DIST }}/*'
          sbom-path: '${{ env.DIST }}/reliabot.spdx.json'

      - name: 'Create draft release'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: '${{ env.DIST }}/*'
          bodyFile: '${{ env.DIST }}/release-notes.md'
          draft: true
          name: '${{ env.RELEASE_NAME }}'
          prerelease: true
          tag: '${{ env.VERSION_TAG }}'
          updateOnlyUnreleased: true
          commit: ${{ github.event.workflow_run.head_sha }}

      - name: 'Prepare packages for TestPyPI'
        run: |
          mkdir -p test_pypi_dist
          cp "$DIST"/*.tar.gz test_pypi_dist/
          cp "$DIST"/*.whl test_pypi_dist/

      - name: 'Publish to TestPyPI'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: 'test_pypi_dist/'
          repository-url: https://test.pypi.org/legacy/

  pypi-release:
    runs-on: ubuntu-24.04
    needs: prepare
    # Only run if prepare succeeds, and it's a full release (pr_release is true)
    if: >
      needs.prepare.outputs.skip == 'false' &&
      needs.prepare.outputs.pr_tag == 'true' &&
      needs.prepare.outputs.pr_release == 'true'
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/reliabot

    env:
      DIST: ${{ needs.prepare.outputs.DIST }}
      RELEASE_NAME: ${{ needs.prepare.outputs.RELEASE_NAME }}
      VERSION_TAG: ${{ needs.prepare.outputs.VERSION_TAG }}

    permissions:
      id-token: write # Trusted publishing requires this permission
      attestations: write
      contents: write # Needed for annotated tag push
      actions: read # Needed to download artifacts

    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            rekor.sigstore.dev:443
            releases.astral.sh:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            upload.pypi.org:443
            uploads.github.com:443

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 'Download artifacts'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$RUN_ID" --dir "$ARTIFACTS_DIR"

      - name: 'Sign built artifacts'
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >
            ${{ env.DIST }}/*.tar.gz
            ${{ env.DIST }}/*.whl
            ${{ env.DIST }}/reliabot.spdx.json

      - name: 'Attest SBOM'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: '${{ env.DIST }}/*'
          sbom-path: '${{ env.DIST }}/reliabot.spdx.json'

      - name: 'Prepare packages for PyPI'
        run: |
          mkdir -p pypi_dist
          cp "$DIST"/*.tar.gz pypi_dist/
          cp "$DIST"/*.whl pypi_dist/

      - name: 'Publish to PyPI'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: 'pypi_dist/'

      - name: 'Create draft release'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: '${{ env.DIST }}/*'
          bodyFile: '${{ env.DIST }}/release-notes.md'
          draft: true
          name: '${{ env.RELEASE_NAME }}'
          prerelease: false
          tag: '${{ env.VERSION_TAG }}'
          updateOnlyUnreleased: true
          commit: ${{ github.event.workflow_run.head_sha }}

      - name: 'Create and push annotated tag'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Annotated tag for full release (not pre-release)
          git tag -a "$VERSION_TAG" -F "$DIST/release-notes.md"
          git push origin "$VERSION_TAG"

  provenance:
    needs: [prepare, test-release, pypi-release]
    if: >
      always() && (
        needs.test-release.result == 'success' ||
        needs.pypi-release.result == 'success'
      )
    permissions:
      actions: read
      id-token: write
      contents: write
    # MUST use @v2.* version pin rather than a hash, required for SLSA Level 3
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.prepare.outputs.hashes }}
      provenance-name: 'reliabot.intoto.jsonl'
      upload-assets: true
      upload-tag-name: ${{ needs.prepare.outputs.VERSION_TAG }}
      continue-on-error: true # Prevent total failure due to Node 20 binaries

  finalize-release:
    runs-on: ubuntu-24.04
    needs: [prepare, pypi-release, provenance] # finalize AFTER provenance
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443

      - name: 'Finalize GitHub release'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          draft: false
          name: '${{ needs.prepare.outputs.RELEASE_NAME }}'
          prerelease: false
          tag: '${{ needs.prepare.outputs.VERSION_TAG }}'
          updateOnlyUnreleased: true
