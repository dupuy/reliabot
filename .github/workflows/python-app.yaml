# This workflow runs for pull requests and pushes (merge/squash/rebase or tags).

# The TESTS job always runs, installing Python Poetry dependencies, building a
# distribution and running tests on a matrix of Python versions. It also
# computes several outputs for use by other jobs, often in 'if' conditions.
#
# The first output (VERSION_TAG) describes the intended Reliabot version:
# the current tag, a desired (pre-)release tag to be applied, or a "left over"
# version of the most recent release tag.
# All outputs are also environment variables in jobs that use them, and use
# underscore '_' rather than hyphen '-' in their names. so shell 'run' scripts
# can use them as environment variables rather than '${{ }}' substitutions
# vulnerable to shell meta-characters in the value.
# Although TESTS uses `poetry version` to get this value from 'pyproject.toml',
# and poetry rejects metacharacters in the version, using a shell-friendly name
# prevents a compromised action or workflow from exploiting these variables by
# overriding the poetry-computed value.
#
# The TESTS job uses `git describe` to compute another variable (COMMIT_TAG)
# that is not an output. Its value can be the current VERSION_TAG ("v1.2.3") or
# a previous VERSION_TAG followed by '-', the number of further commits, and
# a short commit hash, like this: 'v1.2.3-13-ca11ab1e'. The latter indicates an
# "interim" (untagged) commit, and can be distinguished from a pre-release tag
# like `v1.2.3-rc.5' by the presence of a second '-'.
#
# The TESTS job uses these variables to determine the type of push (merge) or
# pull request it is handling, and creates outputs for other jobs to use in 'if'
# conditions for jobs or steps.
#
# * pr_commit  :: COMMIT_TAG != VERSION_TAG
# * pr_release :: VERSION_TAG has no '-'
# * pr_tag     :: COMMIT_TAG does not start with VERSION_TAG + '-'
#
# [The pr_tag test uses '-' to prevent 'v1.2.10' starts with 'v1.2.1' mistakes.]
#
# - Tag push:     pr_commit=false pr_release=false pr_tag=false (take no action)
# - "Interim" PR: pr_commit=true pr_release=false pr_tag=false (no tag/release)
# - Pre-release:  pr_commit=true pr_release=false pr_tag=true (tag + TestPyPI)
# - Release:      pr_commit=true pr_release=true pr_tag=true (annotated + PyPI)
#
# [Only releases use annotated tags so `git describe` ignores pre-releases.]
# [Also note pr_tag=true implies pr_commit=true so latter test may be omitted.]
#
# The TESTS job also computes two other outputs to coordinate (upload/download)
# between the pull_request and push workflows, and the jobs within them:
#
# - ARTIFACT_NAME - GitHub artifact containing dist/ release for publishing
# - RELEASE_NAME - GitHub title of release or pre-release

# The convention for output names is that booleans are lowercase, while strings
# are UPPERCASE. This may help you remember to use RELEASE_NAME rather than
# pr_release when you want the actual name. ALL outputs use underscores rather
# than hyphens (kebab-case) so they can also be used as environment variables.

# Since only the last matrix instance output is available, and there's no way to
# know which one that is, all matrix instances compute the outputs.
#
# All other jobs run only on one or the other of pull_request or push events:
#
# pull_request:  build → draft-release, test-publish
# push:          pre-release || ( publish → release )

# The BUILD job creates a Python package release, release notes, and a full
# changelog, uploading them as artifacts for other pull_request and push jobs.
# The lifetime of these artifacts is linked to the "stale" workflow that closes
# inactive PRs. By closing PRs before their artifacts expire, the stale workflow
# prevents push workflow failures. The pull_request workflow runs on "reopen"
# or "ready for review" events, recreating expired artifacts before any "push".

name: 'Test, build, release, and upload Python Poetry app'

env:
  OUTPUT: dist/release-notes.md # from release.toml
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - '**.py'
      - '.github/workflows/python-app.yaml'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'release.toml'
      - 'requirements.txt'
      - 'setup.cfg'
      - 'testdir/**'
      - 'tox.ini'

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'dupuy/reliabot'
    runs-on: ubuntu-24.04 # ubuntu-26.04 once in public beta

    outputs:
      VERSION_TAG: ${{ steps.computed.outputs.VERSION_TAG }}
      ARTIFACT_NAME: ${{ steps.computed.outputs.ARTIFACT_NAME }}
      pr_commit: ${{ steps.computed.outputs.pr_commit }}
      pr_release: ${{ steps.computed.outputs.pr_release }}
      pr_tag: ${{ steps.computed.outputs.pr_tag }}
      RELEASE_NAME: ${{ steps.computed.outputs.RELEASE_NAME }}
    strategy:
      matrix:
        fail-fast: [true]
        max-concurrency: [5]
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.14'

    steps:
      - name: 'Harden runner'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The `git describe` COMMIT_TAG output requires these fetch-* options.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Install Poetry'
        run: 'pipx install poetry'

      - name: 'Compute outputs for other jobs'
        id: computed
        run: >
          {
            COMMIT_TAG=$(git describe) &&
              echo "COMMIT_TAG=$COMMIT_TAG" >&2 ;
            VERSION_TAG="v$(poetry version --short |
              sed -e 's/a/-alpha./' -e 's/b/-beta./' -e 's/rc/-rc./')" &&
                echo "VERSION_TAG=$VERSION_TAG" ;
            case "$COMMIT_TAG" in
              *-[abr]*-[1-9]*-*)
                exec >&2
                echo "The COMMIT_TAG that 'git describe' created is based on" ;
                echo "a pre-release tag, which prevents proper generation" ;
                echo "of new releases!" ;
                echo "Make sure git describe is not using --tags, and use" ;
                echo "'git show' to check if the pre-release base tag is" ;
                echo "an annotated tag like release tags."
                exit 1 ;;
              "${VERSION_TAG}")
                echo "ARTIFACT_NAME=" ;
                echo "pr_commit=false" ; echo "pr_tag=false" ;
                echo "pr_release=false" ; echo "RELEASE_NAME=" ;;
              "${VERSION_TAG}"-*)
                echo "ARTIFACT_NAME=" ;
                echo "pr_commit=true" ; echo "pr_tag=false" ;
                echo "pr_release=false" ; echo "RELEASE_NAME=" ;;
              *)
                echo "ARTIFACT_NAME=dist-reliabot-$VERSION_TAG" ;
                echo "pr_commit=true" ; echo "pr_tag=true" ;
                case "$VERSION_TAG" in
                  *-*)
                    echo "pr_release=false" ;
                    echo "RELEASE_NAME=Pre-release $VERSION_TAG" ;;
                  *)
                    echo "pr_release=true" ;
                    echo "RELEASE_NAME=Release $VERSION_TAG" ;;
                esac ;
            esac ;
          } | tee -a "$GITHUB_OUTPUT"

      - name: 'Set up Python'
        if: steps.computed.outputs.pr_commit == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '${{ matrix.python-version }}'
          cache: 'poetry'

      - name: 'Install dependencies with extras'
        if: >
          steps.computed.outputs.pr_commit == 'true' &&
          matrix.python-version != 3.14
        run: 'poetry install --extras re2-wheels --with testing'

      - name: 'Install dependencies without extras'
        if: >
          steps.computed.outputs.pr_commit == 'true' &&
          matrix.python-version == 3.14
        run: 'poetry install --with testing'

      - name: 'Run tests'
        if: steps.computed.outputs.pr_commit == 'true'
        run: 'poetry run tox -e py'

  build:
    runs-on: ubuntu-24.04

    # Build for pull requests AND for release-related push events to main.
    if: >
      github.repository == 'dupuy/reliabot' &&
      (github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.tests.outputs.pr_tag == 'true'))
    env:
      VERSION_TAG: ${{ needs.tests.outputs.VERSION_TAG }}
      ARTIFACT_NAME: ${{ needs.tests.outputs.ARTIFACT_NAME }}
      pr_commit: ${{ needs.tests.outputs.pr_commit }}
      pr_release: ${{ needs.tests.outputs.pr_release }}
      pr_tag: ${{ needs.tests.outputs.pr_tag }}
      RELEASE_NAME: ${{ needs.tests.outputs.RELEASE_NAME }}
    needs:
      - tests
    # Only contents:read permission is needed to upload artifacts, not contents:write

    steps:
      - name: 'Harden runner'
        if: env.pr_commit == 'true'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            syft-releases.anchore.io:443
            toolbox-data.stepsecurity.io:443

      - name: 'Checkout repository'
        if: env.pr_commit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The `git-cliff` release notes action requires these fetch-* options.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Install Poetry'
        if: env.pr_commit == 'true'
        run: 'pipx install poetry'

      - name: 'Set up Python'
        if: env.pr_commit == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '>=3.9 <3.15'
          cache: 'poetry'

      - name: 'Build distribution packages'
        if: env.pr_commit == 'true'
        run: 'poetry build'

      - name: 'Generate SBOM'
        if: env.pr_commit == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./
          output-file: dist/reliabot.spdx.json
          format: spdx-json

      - name: 'Generate release notes'
        if: env.pr_tag == 'true'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          args: >
            '--unreleased'
            '--tag=${{ env.VERSION_TAG }}'
          config: release.toml
          version: 'v2.9.1'

      - name: 'Generate "unreleased" notes'
        if: env.pr_commit == 'true' && env.pr_tag == 'false'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          args: '--unreleased'
          config: release.toml
          version: 'v2.9.1'

      - name: 'Generate metadata for publish workflow'
        if: env.pr_tag == 'true'
        run: |
          METADATA_FILE=dist/metadata.json
          cat <<EOF >"$METADATA_FILE"
          {
            "ARTIFACT_NAME": "$ARTIFACT_NAME",
            "pr_release": "$pr_release",
            "pr_tag": "$pr_tag",
            "RELEASE_NAME": "$RELEASE_NAME",
            "VERSION_TAG": "$VERSION_TAG",

            "JSON requires": "a comma-less final entry"
          }
          EOF
          python3 -m json.tool "$METADATA_FILE"

      - name: 'Upload distribution package as an artifact'
        if: github.repository == 'dupuy/reliabot' && env.pr_tag == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: '${{ env.ARTIFACT_NAME }}'
          overwrite: true
          path: 'dist/*'
          retention-days: 90 # stale + close + 13 <= artifact retention (90 max)
