# See https://pre-commit.com/ - to use these pre-commit (and commit-msg) hooks:
#   $ brew install pre-commit  OR  $ pip install pre-commit
# Then, in this repository:
#   $ pre-commit install && pre-commit install --hook-type commit-msg
#
# Hooks should be limited to formatters, static checkers, and auto-fixers.
# Please do not add tests here as tests can be slow, pre-commit is not enforced
# and tests should always be run before merging.
#
# reliabot: mapping=2 offset=2 sequence=4 width=75
default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # - id: autopep8-wrapper
      #  args: ['-i', '--ignore=E501']
      - id: check-added-large-files
        args: [--maxkb=50]
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      # - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: styles/
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
      # - id: name-tests-test
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master
          - --pattern=.*[^A-Za-z0-9/._-].* # / . and _ for dependabot
      # - id: sort-simple-yaml
      - id: requirements-txt-fixer
        exclude: reliabot/requirements.txt
      - id: trailing-whitespace

  # Local
  - repo: local
    hooks:
      # prettier-ignore
      - files: >-
          (?x)(^|/)(
            gem(s[.]rb|file)|[\w.-]*[.]gemspec|
            cargo[.]toml|
            composer[.]json|
            (?i:[\w.-]*dockerfile[\w.-]*|values[\w.-]*[.]ya?ml)|
            elm(-package)?[.]json|
            action[.]yml|
            [.]gitmodules|
            go[.]mod|
            build[.]gradle([.]kts)?|
            mix[.]exs|
            pom[.]xml|
            package[.]json|
            nuget[.]config|
            requirements[.]txt|pyproject[.]toml|
            pubspec[.]yaml|
            \w[\w.-]*[.](?:hcl|tf)|
            [.]github/workflows/[^/]*[.]ya?ml|
            [.]github/dependabot[.]yml
            )$
        id: reliabot
        additional_dependencies:
          - ruamel.yaml
          - pyre2-updated # requires C++ RE2 library (`brew install re2`)
        args: [--update]
        entry: reliabot/reliabot.py
        language: python
        language_version: python3.13
        name: maintain dependabot configuration
        pass_filenames: false
      - id: reliabot-pre-commit-files
        additional_dependencies:
          - ruamel.yaml
          - pyre2-updated # requires C++ RE2 library (`brew install re2`)
        args: [--update-pre-commit]
        entry: reliabot/reliabot.py
        files: ^(reliabot/reliabot[.]py|[.]pre-commit-(config|hooks)[.]py)$
        language: python
        language_version: python3.13
        name: maintain pre-commit files configuration
        pass_filenames: false

  # Global
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: ffb6a759a979008c0e6dff86e39f4745a2d9eac4 # frozen: v3.1.0
    hooks:
      - id: prettier
        args: [--single-quote]
        # ,github/workflows changes are handled by local prettier-workflows*
        exclude: >
          fuzz/corpus|styles/|testdir/github/action[.]yml|^[.]github/workflows/
        exclude_types: [markdown]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        args: [-L, 'intoto,pullrequest,pullrequests']
        exclude: styles/
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 'e8b4e28241a9ae8296ba6e4a491b5da4eda73283' # frozen: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        # editorconfig Python installer relies on old setuptools API
        language_version: '3.11'

  # YAML
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --format
          - parsable
          - -d
          - >-
            {
              extends: default,
              rules: {
                comments: {min-spaces-from-content: 1},
                indentation: {indent-sequences: consistent},
                line-length: {max: 150},
                truthy: { check-keys: false}
              }
            }
        exclude: fuzz/corpus|styles/|testdir/github/action[.]yml

  # Shell
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # shellcheck Python installer relies on old setuptools API
        language_version: '3.11'
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      # Choose one of:
      # - id: shfmt-docker # Docker image (requires Docker to run)
      # - id: shfmt-src # build from source (requires/installs Go to build)
      - id: shfmt # prebuilt upstream executable
        args: [-i, '2', -ci]
        # shellfmt Python installer relies on old setuptools API
        language_version: '3.11'

  # GitHub Actions and Workflows
  - repo: https://github.com/kjanat/actionlint
    # (previously https://github.com/rhysd/actionlint v1.7.3)
    # Includes ShellCheck on workflow scripts
    rev: 220b76cfa568e00ed8b3c476898f849a722b88e2 # frozen: v1.17.1
    hooks:
      - id: actionlint-shellcheck
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    # Zizmor static workflow security checker
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [-q, --fix]
        exclude: testdir/
  # Prettier --write for GitHub workflows in local repository
  - repo: local
    hooks:
      - id: prettier-workflows
        name: prettier (for GitHub workflows in local repos)
        entry: prettier --ignore-unknown --single-quote --write
        language: node
        additional_dependencies:
          - prettier@3.8.3
        files: ^[.]github/workflows/.*[.]ya?ml$
        pass_filenames: true
  # Read-only Prettier --check for GitHub workflows in local repository
  # that only has any effect if the prettier --write is skipped
  # This pre-commit is used by pre-commit.ci as GitHub Actions don't have any
  # write access to the `.github/` folder for security reasons.
  - repo: local
    hooks:
      - id: prettier-workflows-ci
        name: prettier (checking only for GitHub workflows)
        # If there is a way to skip this for local repos ONLY, use it.
        entry: prettier --ignore-unknown --single-quote --check
        language: node
        additional_dependencies:
          - prettier@3.8.3
        files: ^[.]github/workflows/.*[.]ya?ml$
        pass_filenames: true

  # Go
  # - repo: https://github.com/syntaqx/git-hooks
  #   rev: v0.0.18
  #   hooks:
  #     - id: go-fmt
  #     - id: go-test
  #     - id: go-mod-tidy
  #     - id: go-generate
  # - repo: https://github.com/golangci/golangci-lint
  #   rev: v1.38.0
  #   hooks:
  #     - id: golangci-lint

  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
        name: 'ruff --fix'
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312 # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus
  - repo: https://github.com/asottile/reorder-python-imports
    rev: 4690733311bbfba33558e4d50a7f0092c64d78d8 # frozen: v3.19.0
    hooks:
      - id: reorder-python-imports
        args:
          - --py311-plus
          # remove from __future__ import annotations when py314 is minimum
          - --add-import=from __future__ import annotations
        files: ^(?!setup.py$).*[.]py$
        stages: [manual] # prevent whitespace battle with ruff --format (Black)
  - repo: https://github.com/PyCQA/prospector
    rev: 43f9d3f86c526e8e27dac80a48d76be03e1a66d3 # frozen: v1.20.0
    hooks:
      - id: prospector
        # Needed for pylint import checks.
        # See https://stackoverflow.com/a/61238571/18829.
        additional_dependencies:
          - ruamel.yaml
          - setuptools # ModuleNotFoundError: No module named 'pkg_resources'
        args:
          - --messages-only
          - --doc-warnings
          # All other prospector tools are replaced by ruff --fix
          - --tool=pylint # comment out if you get "pylint: astroid-error ..."
          - --tool=dodgy
  - repo: https://github.com/PyCQA/bandit
    rev: '92ae8b82fb422a639f0ed8d99e96cea769594e08' # frozen: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ['bandit[toml]']
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # frozen: v2.4.1
    hooks:
      - id: mypy
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # frozen: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      # - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      # - id: rst-backticks
      # - id: rst-directive-colons
      # - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
  - repo: https://github.com/asottile/dead
    rev: 2cf8b462e06c27930d692496c9026640b0ed89d8 # frozen: v2.1.0
    hooks:
      - id: dead
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/python-poetry/poetry
    # see https://python-poetry.org/docs/pre-commit-hooks/#faq
    rev: '94b6e35b9091991887aa54feeb3771a86d3bd692' # frozen: 2.5.1
    hooks:
      - id: poetry-lock
      # NOTE: poetry-check complains about tools.poetry settings that can't
      # be fixed until the project switches to poetry 2.0. Ignore for now.
      - id: poetry-check

  # Poetry 2.0 removed poetry-export hook - see README.md in this repo
  - repo: https://github.com/python-poetry/poetry-plugin-export
    rev: 'a83af64e9bd101f561b9be4fdc54fdc75abbbe23' # frozen: 1.10.1
    hooks:
      - id: poetry-export
        args:
          - --format=requirements.txt
          - --output=reliabot/requirements.txt
          - --without-hashes

  # Markdown
  - repo: local
    hooks:
      - id: tidy-md-refs
        name: Tidy numbering of Markdown reference links
        language: script
        entry: ./tidy-md-refs.py
        types: [markdown]
        exclude: tests/
  - repo: https://github.com/hukkin/mdformat
    rev: '82912cdaea4fb830f751504486a7879c70526547' # frozen: 1.0.0
    hooks:
      - id: mdformat
        args:
          - --number
          - --wrap
          - '79'
        additional_dependencies:
          - mdformat-beautysh # shell
          - mdformat-black # python
          - mdformat-config # json, toml, yaml
          - mdformat-frontmatter # for Markdown & YAML
          - mdformat-gfm # GitHub-flavored Markdown
          - mdformat-toc # generate table of contents
        exclude: docs/CHANGELOG-.*|styles/|tests/

  - repo: https://github.com/markdownlint/markdownlint
    rev: 54b2597eb40d50a16a51d717744239d52218fd5b # frozen: v0.13.0
    hooks:
      - id: markdownlint
        args: [--style=.mdl-style.rb]
        exclude: tests/

  - repo: https://github.com/errata-ai/vale
    rev: 4ce91ef208b37f9ac2894766e8cd7b33ffe3baed # frozen: v3.27.0
    hooks:
      - id: vale
        exclude: CHANGELOG*|LICENSE|humans[.]txt|requirements.*|styles/
        types_or:
          - asciidoc
          - html
          - markdown
          - ngdoc
          - plain-text
          - rst
          - tex
          - xhtml

  # Terraform
  # - repo: https://github.com/antonbabenko/pre-commit-terraform
  #   rev: v1.80.0
  #   hooks:
  #     - id: terraform_fmt
  #       exclude: (scripts|snippets)
  #     - id: terraform_tflint
  #       args:
  #         - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
  #       exclude: snippets
  #     - id: terraform_tfsec
  #       args:
  #         - --args=--concise-output
  #         - --args=--exclude-downloaded-modules

  # CloudFormation
  # - repo: https://github.com/awslabs/cfn-python-lint
  #   rev: v0.44.7
  #   hooks:
  #     - id: cfn-python-lint

  # Docker
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint
        args: ['--failure-threshold=info']

  # Git commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --verbose]

  # Pre-commit
  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: b09f43ffbb3529a643f6616844e226148c622d3c # frozen: v0.10.0
    hooks:
      - id: pre-commit-update
        files: .pre-commit-config.yaml|pyproject.toml
        stages: [manual, pre-commit]
        args:
          - '--keep=markdownlint' # Install >v0.13.0 too slow for pre-commit.ci
          - '--verbose'
          - '--warnings'
  - repo: local
    hooks:
      # pre-commit-update bumps SHA pins but not the `# frozen: <tag>` comments
      - id: fix-frozen-tags
        name: verify frozen tags on SHA-pinned revs
        entry: ./fix-frozen-tags.py
        language: python
        files: ^\.pre-commit-config\.yaml$
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # Local hooks
  - repo: local
    hooks:
      # Use param, raises, returns and var; use PEP484 annotations for types.
      - id: check-docstring-keywords
        name: Check docstring keywords
        language: pygrep
        entry: >-
          ^\s+:((arg(ument)?|[ci]var|except(ion)?|raise)|(return|(r|var)?type):)\s
        types: [python]
      # No parameter for returns, exactly 1 for param, raises and var.
      - id: check-docstring-keyword-usage
        name: Check docstring keyword usage
        language: pygrep
        entry: ^\s+:(returns\s[^:]*|(param|raises|var)(\s+[^:\s]+\s[^:]*)?):\s
        types: [python]
      - id: markdown-link-check
        name: Check links in Markdown sources
        # Uses Node.js https://github.com/tcort/markdown-link-check
        # Hook adapted from https://github.com/mineiros-io/pre-commit-hooks/
        description: |
          Checks hyperlinks in a markdown text to see if they're still valid.
        entry: scripts/markdown-link-check.sh
        language: script
        types: [markdown]
        exclude: tests/
ci:
  autofix_commit_msg: |
    fix: auto-fixes from pre-commit.ci

    Configured by .pre-commit-config.yaml
    Checks run by https://pre-commit.ci
  autofix_prs: true # this is what is really useful about pre-commit.ci
  #  pre-commit.ci autoupdate not as good as pre-commit-update
  autoupdate_commit_msg: >
    'chore: close this & run `pre-commit run -a pre-commit-update`'
  autoupdate_schedule: 'quarterly' # ideally: 'never'
  # Checks to disable on pre-commit.ci (sadly, not autoupdate)
  skip:
    - hadolint
    - markdown-link-check
    - poetry-lock
    - prettier-workflows
